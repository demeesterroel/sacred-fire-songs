<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Fire has Flickered - 500 - Sacred Fire Songs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    :root {
      --fire-glow: rgba(255, 68, 0, 0.15);
      --fire-accent: #ff4400;
    }

    body {
      background-color: #0b0f1a;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    .outfit {
      font-family: 'Outfit', sans-serif;
    }

    /* Ambient Glow */
    .ambient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vw;
      height: 80vh;
      background: radial-gradient(circle, var(--fire-glow) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    /* Glassmorphism Card */
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Ember Animation */
    .ember {
      position: absolute;
      background: var(--fire-accent);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      filter: blur(1px);
      animation: rise 4s ease-in infinite;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }

      20% {
        opacity: 0.6;
      }

      80% {
        opacity: 0.3;
      }

      100% {
        transform: translateY(-100vh) scale(0.5);
        opacity: 0;
      }
    }

    .hearth-button {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(255, 68, 0, 0.1);
      border: 1px solid rgba(255, 68, 0, 0.3);
    }

    .hearth-button:hover {
      background: rgba(255, 68, 0, 0.2);
      border-color: var(--fire-accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(255, 68, 0, 0.2);
    }

    .error-icon-wrapper {
      position: relative;
      display: inline-flex;
    }

    .error-icon-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: var(--fire-accent);
      filter: blur(25px);
      opacity: 0.4;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.4;
      }

      50% {
        transform: translate(-50%, -50%) scale(1.3);
        opacity: 0.6;
      }
    }

    /* Pulsing Glow Border for 500 */
    .glow-border {
      box-shadow: 0 0 40px rgba(255, 68, 0, 0.1) inset;
      border: 1px solid rgba(255, 68, 0, 0.2);
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-6 bg-[#0b0f1a]">
  <div class="ambient-glow"></div>

  <!-- Animated Embers -->
  <script>
    function createEmber() {
      const ember = document.createElement('div');
      ember.className = 'ember';
      const size = Math.random() * 4 + 2;
      ember.style.width = `${size}px`;
      ember.style.height = `${size}px`;
      ember.style.left = `${Math.random() * 100}vw`;
      ember.style.animationDuration = `${Math.random() * 3 + 3}s`;
      ember.style.bottom = '-10px';
      document.body.appendChild(ember);
      setTimeout(() => ember.remove(), 6000);
    }
    setInterval(createEmber, 300);
  </script>

  <header class="fixed top-0 left-0 w-full p-8 flex justify-center z-10">
    <div class="flex items-center gap-2 opacity-60">
      <span class="material-symbols-outlined text-[var(--fire-accent)] text-xl">local_fire_department</span>
      <span class="outfit font-semibold tracking-widest text-xs uppercase">Sacred Fire Songs</span>
    </div>
  </header>

  <main class="relative z-10 text-center max-w-xl">
    <div class="error-icon-wrapper mb-8">
      <div class="error-icon-glow"></div>
      <span class="material-symbols-outlined text-[var(--fire-accent)] text-7xl relative z-10">warning</span>
    </div>

    <h1 class="outfit text-6xl md:text-8xl font-bold mb-4 tracking-tight opacity-90">500</h1>

    <h2 class="outfit text-2xl md:text-4xl font-semibold mb-6 text-white/90">
      The Fire has Flickered
    </h2>

    <p class="text-[#a19eb7] text-sm md:text-base leading-relaxed mb-10 max-w-md mx-auto">
      Our keepers are working to relight the hearth. Something went wrong on our end, and the smoke has obscured the
      path.
    </p>

    <a href="../screen1_home.html"
      class="hearth-button inline-flex items-center gap-3 px-8 py-4 rounded-xl text-white font-medium group text-sm md:text-base">
      <span
        class="material-symbols-outlined text-xl text-[var(--fire-accent)] group-hover:rotate-12 transition-transform">explore</span>
      Return to the Hearth
    </a>
  </main>

  <footer class="fixed bottom-8 w-full text-center z-10">
    <p class="text-[#a19eb7]/30 text-[10px] uppercase tracking-[0.2em]">Internal Server Error</p>
  </footer>
</body>

</html>
