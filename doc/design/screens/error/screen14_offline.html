<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost in the Wilderness - Offline - Sacred Fire Songs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    :root {
      --fog-glow: rgba(148, 163, 184, 0.1);
      --fog-accent: #94a3b8;
    }

    body {
      background-color: #0b0f1a;
      font-family: 'Inter', sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    .outfit {
      font-family: 'Outfit', sans-serif;
    }

    /* Foggy Ambient Glow */
    .ambient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, var(--fog-glow) 0%, transparent 80%);
      z-index: 0;
      pointer-events: none;
    }

    /* Fog Animation */
    .fog-mist {
      position: absolute;
      width: 200%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(148, 163, 184, 0.05), transparent);
      filter: blur(50px);
      animation: drift-fog 20s linear infinite;
    }

    @keyframes drift-fog {
      0% {
        transform: translateX(-50%);
      }

      100% {
        transform: translateX(0%);
      }
    }

    .hearth-button {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      background: rgba(148, 163, 184, 0.1);
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .hearth-button:hover {
      background: rgba(148, 163, 184, 0.2);
      border-color: var(--fog-accent);
      transform: translateY(-2px);
    }

    .error-icon-wrapper {
      position: relative;
      display: inline-flex;
    }

    .error-icon-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: var(--fog-accent);
      filter: blur(25px);
      opacity: 0.2;
      border-radius: 50%;
      animation: pulse-fog 4s ease-in-out infinite;
    }

    @keyframes pulse-fog {

      0%,
      100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.2;
      }

      50% {
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 0.3;
      }
    }

    /* Cold Snow-like Particles */
    .snow {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      filter: blur(1px);
      animation: fall 10s linear infinite;
    }

    @keyframes fall {
      0% {
        transform: translate(0, 0);
        opacity: 0;
      }

      10% {
        opacity: 0.4;
      }

      90% {
        opacity: 0.4;
      }

      100% {
        transform: translate(20vw, 100vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-6 bg-[#0b0f1a]">
  <div class="ambient-glow"></div>
  <div class="fog-mist" style="top: 20%; animation-delay: -5s;"></div>
  <div class="fog-mist" style="top: 50%; animation-delay: -12s;"></div>

  <script>
    function createSnow() {
      const snow = document.createElement('div');
      snow.className = 'snow';
      const size = Math.random() * 3 + 1;
      snow.style.width = `${size}px`;
      snow.style.height = `${size}px`;
      snow.style.left = `${Math.random() * 100}vw`;
      snow.style.top = '-10px';
      snow.style.animationDuration = `${Math.random() * 5 + 7}s`;
      document.body.appendChild(snow);
      setTimeout(() => snow.remove(), 12000);
    }
    setInterval(createSnow, 500);
  </script>

  <header class="fixed top-0 left-0 w-full p-8 flex justify-center z-10">
    <div class="flex items-center gap-2 opacity-40">
      <span class="material-symbols-outlined text-[#94a3b8] text-xl">cloud_off</span>
      <span class="outfit font-semibold tracking-widest text-xs uppercase">Sacred Fire Songs</span>
    </div>
  </header>

  <main class="relative z-10 text-center max-w-xl">
    <div class="error-icon-wrapper mb-8">
      <div class="error-icon-glow"></div>
      <span class="material-symbols-outlined text-[#94a3b8] text-7xl relative z-10">wifi_off</span>
    </div>

    <h1 class="outfit text-6xl md:text-8xl font-bold mb-4 tracking-tight opacity-70">Offline</h1>

    <h2 class="outfit text-2xl md:text-4xl font-semibold mb-6 text-white/80">
      Lost in the Wilderness
    </h2>

    <p class="text-[#a19eb7] text-sm md:text-base leading-relaxed mb-10 max-w-md mx-auto">
      The connection to the hearth has been lost. You are currently wandering in the cold fog, but your saved songs
      remain in your memory.
    </p>

    <button onclick="window.location.reload()"
      class="hearth-button inline-flex items-center gap-3 px-8 py-4 rounded-xl text-white font-medium group text-sm md:text-base">
      <span
        class="material-symbols-outlined text-xl text-[#94a3b8] group-hover:rotate-12 transition-transform">refresh</span>
      Try to Relight the Fire
    </button>
  </main>

  <footer class="fixed bottom-8 w-full text-center z-10">
    <p class="text-[#a19eb7]/20 text-[10px] uppercase tracking-[0.2em]">Disconnected from Hearth</p>
  </footer>
</body>

</html>
