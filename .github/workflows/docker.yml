name: Build and push Docker image

on:
  push:
    branches: ["*"]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to apply (e.g. v1.4.0-rc.1 or preview)"
        required: false
        default: ""

jobs:
  build:
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(main): release') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract semver from release tag
        if: github.event_name == 'release'
        id: semver
        run: echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata for App
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/demeesterroel/sacred-fire-songs
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short,enable={{is_default_branch}}
            type=ref,event=branch,slugify=true
            type=ref,event=tag
            type=raw,value={{tag}},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ steps.semver.outputs.value }},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker metadata for Migrator
        id: meta-migrator
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/demeesterroel/sacred-fire-songs-migrator
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short,enable={{is_default_branch}}
            type=ref,event=branch,slugify=true
            type=ref,event=tag
            type=raw,value={{tag}},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ steps.semver.outputs.value }},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.migrator
          push: true
          tags: ${{ steps.meta-migrator.outputs.tags }}
          labels: ${{ steps.meta-migrator.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
