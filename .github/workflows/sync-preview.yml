name: Sync Preview to Private Repo

on:
  push:
    branches:
      - '**'
      - '!main' # Ignore main, since main deployment is handled separately

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Private Repo Update
        run: |
          # Extract full branch name (properly handles slashes like feature/some-name)
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Syncing branch: $BRANCH_NAME to private deployment repository"
          
          # Setup Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clone private repository using the PAT
          git clone https://x-access-token:${{ secrets.PRIVATE_REPO_SYNC_TOKEN }}@github.com/demeesterroel/songbook-rocks.git private-repo
          cd private-repo
          
          # Checkout or create corresponding branch in private repo
          git checkout $BRANCH_NAME || git checkout -b $BRANCH_NAME
          
          # Initialize and update submodule
          git submodule sync engine
          git submodule update --init engine
          
          cd engine
          git fetch origin
          git checkout ${{ github.sha }}
          cd ..
          
          # Stage, commit and push changes to trigger Vercel preview
          git add engine
          if git diff --staged --quiet; then
            echo "No changes in submodule pointer."
          else
            git commit -m "chore: auto-sync engine preview to commit ${{ github.sha }}"
            git push origin $BRANCH_NAME
          fi
