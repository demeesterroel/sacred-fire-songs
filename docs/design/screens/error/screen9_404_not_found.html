<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Path Lost - 404 - Sacred Fire Songs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

    body {
      font-family: 'Outfit', sans-serif;
      background-color: #030712;
      /* Gray 950 */
    }

    .glow-icon {
      filter: drop-shadow(0 0 15px rgba(249, 115, 22, 0.4));
      animation: pulse-glow 4s infinite ease-in-out;
    }

    @keyframes pulse-glow {

      0%,
      100% {
        filter: drop-shadow(0 0 15px rgba(249, 115, 22, 0.3));
        opacity: 0.8;
      }

      50% {
        filter: drop-shadow(0 0 30px rgba(249, 115, 22, 0.6));
        opacity: 1;
      }
    }

    .ember {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #f97316;
      border-radius: 50%;
      animation: rise 12s infinite linear;
      opacity: 0;
      bottom: -10px;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) translateX(0) scale(1);
        opacity: 0;
      }

      10% {
        opacity: 0.6;
      }

      80% {
        opacity: 0.3;
      }

      100% {
        transform: translateY(-100vh) translateX(40px) scale(0.5);
        opacity: 0;
      }
    }

    .ghost-flame {
      stroke-dasharray: 100;
      animation: dash 10s linear infinite;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: 200;
      }
    }
  </style>
</head>

<body
  class="h-screen w-full flex items-center justify-center p-4 relative overflow-hidden bg-[radial-gradient(circle_at_center,_#0f172a_0%,_#030712_100%)]">

  <!-- Ambient glowing embers background -->
  <div id="embers-container" class="absolute inset-0 pointer-events-none z-0"></div>

  <!-- Main Card -->
  <div class="relative z-10 max-w-md w-full text-center p-8">

    <!-- Header Logo (Small) -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-24 opacity-50">
      <div class="flex items-center gap-2">
        <i data-lucide="flame" class="w-4 h-4 text-orange-500"></i>
        <span class="text-xs uppercase tracking-[0.2em] text-gray-400 font-bold">Sacred Fire Songs</span>
      </div>
    </div>

    <!-- Central Icon: Compass/Map or Wandering Flame -->
    <div class="mb-8 relative inline-block">
      <!-- Background glow circle -->
      <div class="absolute inset-0 bg-orange-600/5 blur-3xl rounded-full"></div>

      <div class="relative w-32 h-32 mx-auto flex items-center justify-center">
        <svg viewBox="0 0 24 24" fill="none" class="w-24 h-24 text-orange-500/80 glow-icon" stroke="currentColor"
          stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <!-- Stylized Compass / Lost Path -->
          <circle cx="12" cy="12" r="10" stroke-dasharray="2 4" class="opacity-30" />
          <path d="M16.24 7.76l-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z" />
          <circle cx="12" cy="12" r="1" fill="currentColor" />

          <!-- Fading embers around the compass -->
          <circle cx="19" cy="5" r="0.5" fill="currentColor" class="opacity-40" />
          <circle cx="5" cy="19" r="0.5" fill="currentColor" class="opacity-40" />
          <circle cx="18" cy="18" r="0.8" fill="currentColor" class="opacity-20" />
        </svg>
      </div>
    </div>

    <!-- Text Content -->
    <div class="space-y-4">
      <h1 class="text-6xl font-extrabold text-white/90 tracking-tighter mb-2">404</h1>
      <h2 class="text-2xl md:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-b from-white to-gray-500">
        The Path has Vanished <br /> into the Smoke
      </h2>

      <p class="text-gray-500 text-lg font-light max-w-sm mx-auto">
        The song you seek has not yet been kindled, or the wind has carried it away.
      </p>
    </div>

    <!-- Action Button -->
    <div class="mt-12">
      <a href="../screen1_home.html"
        class="group relative inline-flex items-center justify-center px-10 py-4 font-bold text-white transition-all duration-300 bg-gray-900 border border-gray-800 rounded-2xl hover:border-orange-500/50 hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-orange-500/50 overflow-hidden">
        <!-- Button inner glow/shine -->
        <div
          class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/5 to-transparent -translate-x-[100%] group-hover:translate-x-[100%] transition-transform duration-1000">
        </div>

        <i data-lucide="compass"
          class="w-5 h-5 mr-3 text-orange-400 group-hover:rotate-45 transition-transform duration-500"></i>
        <span>Return to the Hearth</span>
      </a>
    </div>

  </div>

  <!-- Scripts -->
  <script>
    lucide.createIcons();

    // Generate embers
    const container = document.getElementById('embers-container');
    const emberCount = 25;

    for (let i = 0; i < emberCount; i++) {
      const ember = document.createElement('div');
      ember.classList.add('ember');
      ember.style.left = Math.random() * 100 + '%';
      ember.style.animationDuration = (Math.random() * 6 + 6) + 's';
      ember.style.animationDelay = Math.random() * 8 + 's';
      container.appendChild(ember);
    }
  </script>
</body>

</html>
